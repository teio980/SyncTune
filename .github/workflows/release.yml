name: Release SyncTune

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\SyncTune-windows-x64.zip -Force

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncTune-Android
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncTune-Windows
          path: dist/SyncTune-windows-x64.zip

  build-macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build and Package macOS Universal
        run: scripts/package_macos.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncTune-macOS
          path: dist/SyncTune-macos-universal.zip

  publish-release:
    needs: [build-android-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: SyncTune-Android
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SyncTune-Windows
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SyncTune-macOS
          path: release-assets

      - name: Rename and Prepare Files
        run: |
          cd release-assets
          mv app-release.apk SyncTune-Android-release.apk
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SyncTune-Android-release.apk
            release-assets/SyncTune-windows-x64.zip
            release-assets/SyncTune-macos-universal.zip
            release-assets/SHA256SUMS.txt
          name: SyncTune ${{ github.ref_name }}
          body: |
            ## Downloads

            - **Android:** `SyncTune-Android-release.apk`
            - **Windows (x64):** `SyncTune-windows-x64.zip`
            - **macOS (Universal, Apple Silicon + Intel):** `SyncTune-macos-universal.zip`
            - **Checksums:** `SHA256SUMS.txt`

            ## Changes

            - **Local Baseline Fingerprint Reuse**: Persist `local_size` alongside `local_modified_ms` and FLAC `comparison_sha256` in SQLite so subsequent sync scans skip re-reading unchanged MP3 and FLAC files on desktop and Android SAF.
            - **FLAC Scan Checkpointing**: Store and reuse FLAC comparison hashes in `scan_checkpoint` across resumed scans.
            - **Reduced SQLite Write Overhead**: Skip redundant baseline writes when a file's baseline entry is completely unchanged.

            ## Notes

            - **macOS**: Distributed as an ad-hoc signed universal bundle. If Gatekeeper blocks first launch, allow it in **System Settings → Privacy & Security** or run `xattr -cr SyncTune.app`.
          draft: false
          prerelease: false
