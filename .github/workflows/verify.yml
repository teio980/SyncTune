name: Verify SyncTune

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6
  FLUTTER_DART_VERSION: 3.13.5
  FLUTTER_ARCHIVE_SHA256: a01bb0d26de91bc23c97cd9ccfaad281a612fb8304213fdd5df1119a09404796

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache pinned Flutter SDK
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ${{ runner.temp }}\flutter-sdk-${{ env.FLUTTER_VERSION }}
          key: flutter-windows-${{ env.FLUTTER_VERSION }}-${{ runner.arch }}

      - name: Download and verify pinned Flutter SDK
        shell: pwsh
        env:
          SDK_ROOT: ${{ runner.temp }}\flutter-sdk-${{ env.FLUTTER_VERSION }}
          SDK_ARCHIVE: ${{ runner.temp }}\flutter_windows_${{ env.FLUTTER_VERSION }}-stable.zip
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $runnerTempPrefix = "$runnerTemp\"
          $sdkRoot = [System.IO.Path]::GetFullPath($env:SDK_ROOT)
          $sdkArchive = [System.IO.Path]::GetFullPath($env:SDK_ARCHIVE)
          $extract = [System.IO.Path]::GetFullPath((Join-Path $runnerTemp 'flutter-sdk-extract'))
          foreach ($candidate in @($sdkRoot, $sdkArchive, $extract)) {
            if (-not $candidate.StartsWith($runnerTempPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Resolved path is outside RUNNER_TEMP: $candidate"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $sdkRoot 'bin/flutter.bat'))) {
            $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$($env:FLUTTER_VERSION)-stable.zip"
            Invoke-WebRequest -Uri $url -OutFile $sdkArchive
            $actual = (Get-FileHash -LiteralPath $sdkArchive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $env:FLUTTER_ARCHIVE_SHA256) {
              throw "Flutter SDK SHA-256 mismatch. Expected $env:FLUTTER_ARCHIVE_SHA256, got $actual."
            }
            Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            Expand-Archive -LiteralPath $sdkArchive -DestinationPath $extract -Force
            Remove-Item -LiteralPath $sdkRoot -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item -LiteralPath (Join-Path $extract 'flutter') -Destination $sdkRoot
          }
          $env:FLUTTER_ROOT = $sdkRoot
          "$sdkRoot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $sdkRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FLUTTER_SDK_PATH=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Precache Android and Windows build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:FLUTTER_SDK_PATH\bin\flutter.bat" precache --android --windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run verification and release builds
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\verify-project.ps1" `
            -FlutterSdkPath $env:FLUTTER_SDK_PATH `
            -BuildAndroid `
            -BuildWindows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package unsigned MSIX
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\package-msix.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synctune-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/windows/x64/runner/Release
            build/msix/SyncTuneProbe.msix
